name: kiraisoft

services:
  postgres:
    image: postgres18-alpine
    container_name: postgres-container
    build:
      context: ./PostgresContainer
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      kiraisoft-network:
        aliases:
          - postgres-container
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: kiraisoft-backend:latest
    container_name: kiraisoft-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatorio}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID es obligatorio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kiraisoft-network

  frontend:
    image: kiraisoft-frontend
    container_name: kiraisoft-frontend
    build:
      context: ./Fronted
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID es obligatorio}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kiraisoft-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
    name: postgres_data

networks:
  kiraisoft-network:
    name: kiraisoft-network
    driver: bridge

  dokploy-network:
    external: true
    name: dokploy-network
