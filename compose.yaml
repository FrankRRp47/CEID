name: proyectoceid

services:
  postgres:
    image: postgres18-alpine
    container_name: postgres-container
    build:
      context: ./PostgresContainer
      dockerfile: Dockerfile
    env_file:
      - ./PostgresContainer/.env
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      proyectoceid-network:
        aliases:
          - postgres-container
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: proyectoceid-backend:latest
    container_name: proyectoceid-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://miusuario:12345678@postgres-container:5432/mibasededatos
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proyectoceid-network

  frontend:
    image: proyectoceid-frontend
    container_name: proyectoceid-frontend
    env_file:
      - ./Fronted/.env
    build:
      context: ./Fronted
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://proyectoceid-backend:8000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proyectoceid-network

volumes:
  postgres-data:
    name: postgres_data

networks:
  proyectoceid-network:
    name: proyectoceid-network
    driver: bridge
